<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complaint Portal - User</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Welcome, <span id="userName"></span></h1>
    <button class="link" onclick="logout()">Logout</button>
  </header>

  <main>
    <div class="card">
      <h2>Submit a complaint</h2>
      <label for="title">Title</label>
      <input type="text" id="title" maxlength="150">
      <label for="description">Description</label>
      <textarea id="description"></textarea>
      <button onclick="submitComplaint()">Submit</button>
      <div id="formMsg" class="msg"></div>
    </div>

    <div class="card">
      <h2>My complaints</h2>
      <table>
        <thead><tr><th>ID</th><th>Title</th><th>Description</th><th>Status</th><th>Date</th></tr></thead>
        <tbody id="complaintRows"></tbody>
      </table>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    // Page protection: must be logged in, and must not be admin
    async function init() {
      const me = await apiGet("api/me");
      if (me.status !== 200) { window.location.href = "login.html"; return; }
      if (me.data.role === "ADMIN") { window.location.href = "admin.html"; return; }
      document.getElementById("userName").textContent = me.data.name;
      loadComplaints();
    }

    async function loadComplaints() {
      const result = await apiGet("api/complaints");
      const body = document.getElementById("complaintRows");
      body.innerHTML = "";
      if (result.status !== 200) return;
      if (result.data.length === 0) {
        const tr = document.createElement("tr");
        const td = cell("No complaints yet.");
        td.colSpan = 5;
        tr.appendChild(td);
        body.appendChild(tr);
        return;
      }
      result.data.forEach(c => {
        const tr = document.createElement("tr");
        tr.appendChild(cell(c.id));
        tr.appendChild(cell(c.title));
        tr.appendChild(cell(c.description));
        const statusTd = document.createElement("td");
        statusTd.appendChild(statusBadge(c.status));
        tr.appendChild(statusTd);
        tr.appendChild(cell(c.createdAt));
        body.appendChild(tr);
      });
    }

    async function submitComplaint() {
      const result = await apiPost("api/complaints", {
        title: document.getElementById("title").value,
        description: document.getElementById("description").value
      });
      if (result.data.success) {
        showMessage("formMsg", result.data.message, "ok");
        document.getElementById("title").value = "";
        document.getElementById("description").value = "";
        loadComplaints();
      } else {
        showMessage("formMsg", result.data.message || "Could not submit.", "error");
      }
    }

    init();
  </script>
</body>
</html>
