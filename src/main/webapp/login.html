<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ResolveHub - Portal Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="auth-page-body">
  <div class="auth-wrapper">
    <div class="auth-container">
      
      <!-- Top Navigation back to Landing Page -->
      <div class="auth-back-link">
        <a href="index.html" class="back-home-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Back to Home</span>
        </a>
      </div>

      <div class="auth-card">
        
        <!-- Brand Header -->
        <div class="auth-brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <polyline points="9 12 11 14 15 10"/>
            </svg>
          </div>
          <h1>ResolveHub</h1>
          <p>Student & Staff Grievance Redressal Portal</p>
        </div>

        <!-- Auth Tabs -->
        <div class="auth-tabs" role="tablist">
          <button id="tabLogin" class="auth-tab active" type="button" onclick="showTab('login')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            Sign In
          </button>
          <button id="tabRegister" class="auth-tab" type="button" onclick="showTab('register')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            Create Account
          </button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" onsubmit="event.preventDefault(); doLogin();" novalidate>
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              </span>
              <input type="email" id="loginEmail" placeholder="Enter your email (e.g. name@college.com)" required autocomplete="username">
            </div>
          </div>

          <div class="form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <label for="loginPassword" style="margin-bottom:0;">Password</label>
            </div>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="btn-password-toggle" onclick="togglePasswordVisibility('loginPassword', this)" title="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <button type="submit" id="btnLogin" class="btn-primary-large" style="width: 100%; margin-top: 12px;">
            <span>Sign In to Portal</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
          
          <div id="loginMsg" class="msg"></div>

          <div class="auth-helper-note">
            <p>Students and Administrators sign in using their respective college credentials.</p>
          </div>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" style="display:none;" onsubmit="event.preventDefault(); doRegister();" novalidate>
          <div class="form-group">
            <label for="regName">Full Name</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              </span>
              <input type="text" id="regName" placeholder="e.g. Priya Sharma" required autocomplete="name">
            </div>
          </div>

          <div class="form-group">
            <label for="regEmail">College / Personal Email</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              </span>
              <input type="email" id="regEmail" placeholder="e.g. student@college.edu" required autocomplete="email">
            </div>
          </div>

          <div class="form-group">
            <label for="regPassword">Create Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <input type="password" id="regPassword" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password">
              <button type="button" class="btn-password-toggle" onclick="togglePasswordVisibility('regPassword', this)" title="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
            <div class="char-counter" style="text-align:left; margin-top:4px;">Must contain at least 6 characters</div>
          </div>

          <button type="submit" id="btnRegister" class="btn-primary-large" style="width: 100%; margin-top: 12px;">
            <span>Create Student Account</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
          </button>
          
          <div id="registerMsg" class="msg"></div>
        </form>

      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    function showTab(tab) {
      const isLogin = tab === "login";
      document.getElementById("loginForm").style.display = isLogin ? "block" : "none";
      document.getElementById("registerForm").style.display = isLogin ? "none" : "block";
      document.getElementById("tabLogin").className = isLogin ? "auth-tab active" : "auth-tab";
      document.getElementById("tabRegister").className = isLogin ? "auth-tab" : "auth-tab active";
      document.getElementById("loginMsg").style.display = "none";
      document.getElementById("registerMsg").style.display = "none";
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === "password") {
        input.type = "text";
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></line><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
      } else {
        input.type = "password";
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
      }
    }

    // Check query params for tab or admin hints
    (function checkParams() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("tab") === "register") {
        showTab("register");
      }
      if (params.get("role") === "admin") {
        document.getElementById("loginEmail").placeholder = "admin@college.com";
        document.getElementById("loginEmail").focus();
      }
    })();

    async function doLogin() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      if (!email || !password) {
        showToast("Please enter both email and password.", "error");
        showMessage("loginMsg", "Email and password are required.", "error");
        return;
      }

      const btn = document.getElementById("btnLogin");
      btn.disabled = true;
      btn.querySelector("span").textContent = "Authenticating...";

      const result = await apiPost("api/login", { email, password });

      btn.disabled = false;
      btn.querySelector("span").textContent = "Sign In to Portal";

      if (result.data && result.data.success) {
        showToast("Login successful! Redirecting...", "ok", 1500);
        setTimeout(() => {
          window.location.href = result.data.role === "ADMIN" ? "admin.html" : "user.html";
        }, 300);
      } else {
        const errorMsg = (result.data && result.data.message) || "Invalid email or password.";
        showMessage("loginMsg", errorMsg, "error");
        showToast(errorMsg, "error");
      }
    }

    async function doRegister() {
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;

      if (!name || !email || !password) {
        showToast("Please fill in all fields.", "error");
        showMessage("registerMsg", "All fields are required.", "error");
        return;
      }
      if (password.length < 6) {
        showToast("Password must be at least 6 characters.", "error");
        showMessage("registerMsg", "Password must be at least 6 characters.", "error");
        return;
      }

      const btn = document.getElementById("btnRegister");
      btn.disabled = true;
      btn.querySelector("span").textContent = "Creating Account...";

      const result = await apiPost("api/register", { name, email, password });

      btn.disabled = false;
      btn.querySelector("span").textContent = "Create Student Account";

      if (result.data && result.data.success) {
        showToast("Account created successfully! Logging you in...", "ok", 1500);
        setTimeout(() => {
          window.location.href = "user.html";
        }, 350);
      } else {
        const errorMsg = (result.data && result.data.message) || "Registration failed.";
        showMessage("registerMsg", errorMsg, "error");
        showToast(errorMsg, "error");
      }
    }
  </script>
</body>
</html>
