<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ResolveHub - Portal Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-container">
      <div class="auth-card">
        
        <!-- Brand Header -->
        <div class="auth-brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <polyline points="9 12 11 14 15 10"/>
            </svg>
          </div>
          <h1>Complaint Portal</h1>
          <p>Student & Staff Grievance Redressal System</p>
        </div>

        <!-- Auth Tabs -->
        <div class="auth-tabs">
          <button id="tabLogin" class="auth-tab active" type="button" onclick="showTab('login')">Sign In</button>
          <button id="tabRegister" class="auth-tab" type="button" onclick="showTab('register')">Create Account</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" onsubmit="event.preventDefault(); doLogin();">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              </span>
              <input type="email" id="loginEmail" placeholder="e.g. admin@college.com" required autocomplete="username">
            </div>
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
            </div>
          </div>

          <button type="submit" id="btnLogin" style="width: 100%; margin-top: 8px;">
            <span>Sign In to Portal</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
          
          <div id="loginMsg" class="msg"></div>

          <!-- Quick Fill for Admin Testing -->
          <div class="quick-demo-box">
            <span>Admin Demo: <strong>admin@college.com</strong></span>
            <button type="button" class="quick-demo-btn" onclick="fillAdminDemo()">Auto-Fill</button>
          </div>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" style="display:none;" onsubmit="event.preventDefault(); doRegister();">
          <div class="form-group">
            <label for="regName">Full Name</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              </span>
              <input type="text" id="regName" placeholder="e.g. Priya Sharma" required>
            </div>
          </div>

          <div class="form-group">
            <label for="regEmail">College / Personal Email</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              </span>
              <input type="email" id="regEmail" placeholder="priya@college.edu" required>
            </div>
          </div>

          <div class="form-group">
            <label for="regPassword">Create Password</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <input type="password" id="regPassword" placeholder="Minimum 6 characters" minlength="6" required autocomplete="new-password">
            </div>
          </div>

          <button type="submit" id="btnRegister" style="width: 100%; margin-top: 8px;">
            <span>Create Student Account</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
          </button>
          
          <div id="registerMsg" class="msg"></div>
        </form>

      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    function showTab(tab) {
      const isLogin = tab === "login";
      document.getElementById("loginForm").style.display = isLogin ? "block" : "none";
      document.getElementById("registerForm").style.display = isLogin ? "none" : "block";
      document.getElementById("tabLogin").className = isLogin ? "auth-tab active" : "auth-tab";
      document.getElementById("tabRegister").className = isLogin ? "auth-tab" : "auth-tab active";
      document.getElementById("loginMsg").style.display = "none";
      document.getElementById("registerMsg").style.display = "none";
    }

    function fillAdminDemo() {
      document.getElementById("loginEmail").value = "admin@college.com";
      document.getElementById("loginPassword").value = "admin123";
      showToast("Admin credentials filled. Click Sign In!", "ok", 2500);
    }

    async function doLogin() {
      const btn = document.getElementById("btnLogin");
      btn.disabled = true;
      btn.querySelector("span").textContent = "Authenticating...";

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      const result = await apiPost("api/login", { email, password });

      btn.disabled = false;
      btn.querySelector("span").textContent = "Sign In to Portal";

      if (result.data && result.data.success) {
        showToast("Login successful! Redirecting...", "ok", 1500);
        setTimeout(() => {
          window.location.href = result.data.role === "ADMIN" ? "admin.html" : "user.html";
        }, 300);
      } else {
        const errorMsg = (result.data && result.data.message) || "Invalid email or password.";
        showMessage("loginMsg", errorMsg, "error");
        showToast(errorMsg, "error");
      }
    }

    async function doRegister() {
      const btn = document.getElementById("btnRegister");
      btn.disabled = true;
      btn.querySelector("span").textContent = "Creating Account...";

      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;

      const result = await apiPost("api/register", { name, email, password });

      btn.disabled = false;
      btn.querySelector("span").textContent = "Create Student Account";

      if (result.data && result.data.success) {
        showToast("Account created successfully! You can now log in.", "ok", 3000);
        showMessage("registerMsg", result.data.message || "Registration successful! Please sign in.", "ok");
        document.getElementById("regName").value = "";
        document.getElementById("regEmail").value = "";
        document.getElementById("regPassword").value = "";
        setTimeout(() => showTab("login"), 1200);
      } else {
        const errorMsg = (result.data && result.data.message) || "Registration failed.";
        showMessage("registerMsg", errorMsg, "error");
        showToast(errorMsg, "error");
      }
    }
  </script>
</body>
</html>
